name: Build RankFlow Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Sync version from tag
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''

          $versionFile = "src/core/version.py"
          $content = Get-Content $versionFile -Raw
          $content = $content -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`""
          [System.IO.File]::WriteAllText(
            $versionFile,
            $content,
            (New-Object System.Text.UTF8Encoding($false))
          )

          $issFile = "RankFlow.iss"
          $content = Get-Content $issFile -Raw
          $content = $content -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
          $content = $content -replace 'OutputBaseFilename=RankFlow_Setup_v.*', "OutputBaseFilename=RankFlow_Setup_v$version"
          [System.IO.File]::WriteAllText(
            $issFile,
            $content,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Write-Host "Building RankFlow version $version"

      - name: Build RankFlow
        run: pyinstaller RankFlow.spec --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "RankFlow.iss"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true