<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>RankFlow Overlay</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="overlay">

        <div id="result-popup" class="result-popup">

            <div id="result-title">
                VICTORY
            </div>

            <div id="result-sr">
                ▲ +50
            </div>

        </div>

        <div id="rank-popup" class="rank-popup">

            <div id="rank-title">
                RANK UP
            </div>

            <div id="new-rank">
                Diamond II
            </div>

        </div>

        <div class="rank">

            <img
                id="rank-icon"
                src="../assets/ranks/diamond2.png"
                alt="Rank">

            <div class="info">

                <div
                    class="rank-name"
                    id="rank-name">
                    Diamond II
                </div>

                <div
                    class="sr"
                    id="sr">
                    5825 SR
                </div>

            </div>

        </div>

        <div class="session-block">

            <div class="session-label">
                SESSION
            </div>

            <div
                id="session"
                class="session positive">

                ▲ +175 SR

            </div>

        </div>

    </div>

    <script src="overlay.js"></script>

</body>

</html>
