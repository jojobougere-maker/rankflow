<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RankFlow Overlay</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="overlay">

    <div id="rank">
        <img id="rankImage">
        <div id="rankName">IRIDESCENT</div>
    </div>

    <div id="sr">
        7000 SR
    </div>

    <div id="progress">

        <div id="progressFill"></div>

    </div>

    <div class="stat">

        📈 <span id="session">+0 SR</span>

    </div>

    <div class="stat">

        📊 WR :
        <span id="wr">0%</span>

    </div>

    <div class="stat">

        🔥
        <span id="streak">0</span>

    </div>

</div>

<div id="srPopup"></div>

<div id="eventPopup"></div>

<script src="script.js"></script>

</body>
</html>
